name: CI

on:
  push:
    branches:
      - main
      - phase-*  # Trigger on all branches starting with 'phase-'
  pull_request:
    branches:
      - main
      - phase-*

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pylint hadolint

      - name: Lint Python code
        run: |
          pylint src/

      - name: Lint Dockerfile
        run: |
          hadolint Dockerfile

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build Docker image
        run: |
          docker build -t hivebox:latest .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

  version_test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build Docker image
        run: |
          docker build -t hivebox:latest .

      - name: Run Docker container
        run: |
          docker run -d --name hivebox_container -p 8000:8000 hivebox:latest

      - name: Test /version endpoint
        run: |
          sleep 5  # Wait for the server to start
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/version)
          expected_version="v0.0.1"  # Change this to your expected version
          if [ "$response" != "200" ]; then
            echo "Error: Expected HTTP status 200, but got $response"
            exit 1
          fi
          echo "Version endpoint returned 200 OK"

      - name: Stop and remove Docker container
        run: |
          docker stop hivebox_container
          docker rm hivebox_container

  scorecard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run OpenSSF Scorecard
        uses: open-ssf/scorecard-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}