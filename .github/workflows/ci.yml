name: CI

on:
  push:
    branches:
      - main
      - phase-*  
  pull_request:
    branches:
      - main
      - phase-*

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pylint hadolint

      - name: Lint Python code
        run: |
          pylint src/

      - name: Lint Dockerfile
        run: |
          hadolint Dockerfile

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build Docker image
        run: |
          docker build -t hivebox:latest .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

  scorecard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run OpenSSF Scorecard
        uses: open-ssf/scorecard-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
